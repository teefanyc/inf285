<!DOCTYPE html>
<html lang="en">
  <head>
    <!--Load the spectrum library-->
    <script src="https://jspm.dev/@spectrum-web-components/bundle/elements.js" type="module" async></script>
    <!--Load the data files for widgets and shipping, then the script file.-->
    <script src="widgets_data.js"></script>
    <script src="shipping_data.js"></script>
    <script src="script.js"></script>
    <!--Load the external stylesheet and favicon.-->
    <link rel="stylesheet" href="style.css">
    <link rel="store icon" href="favicon.ico">
    <title>My Widget Store: Shipping</title>
  </head>
  <body onload="loadShippingPage()">
    <sp-theme scale="medium" color="light">
      <!--TODO: your code here!-->

      <div class="topbar">
          <div class="logo" onclick="gotoOrderPage()">My Widget Store</div>
      </div>

      <!--content-->
      <div class="main">
        <div class="shipping">
          <div class="shipping-header">
            <h1>Shipping</h1>
            <sp-divider size="m"></sp-divider>
          </div>

          <div class="form">
          <h2>Address</h2>

          <div class="form-field">
            <sp-field-label required>Address</sp-field-label>
            <sp-textfield placeholder="Address" id="address"></sp-textfield>
          </div>
          <div class="form-field">
            <sp-field-label required>City</sp-field-label>
            <sp-textfield placeholder="City" id="city"></sp-textfield>
          </div> 
          <div class="form-field">
            <sp-field-label required>State</sp-field-label>
            <sp-textfield placeholder="State"  id="state"></sp-textfield>
          </div>
          <div class="form-field">
            <sp-field-label required>Zip Code</sp-field-label>
            <sp-textfield placeholder="Zip Code"  id="zip"></sp-textfield>
          </div>
          <div class="form-field">
            <sp-help-text slot="help-text">* Required field.</sp-help-text>
          </div>

          </div>

          <div class="form">
          <h2>Shipping Speed</h2>
          <sp-picker label="Select Shipping Speed:" id="shipping_speed">
              <sp-menu-item value="slow">Slow Shipping (10 days, $0.99)</sp-menu-item>
              <sp-menu-item value="standard">Standard Shipping (5 days, $3.99)</sp-menu-item>
              <sp-menu-item value="express">Express Shipping (1 day, $15.99)</sp-menu-item>
          </sp-picker>
          </div>

          <!--TODO: you may choose a different way of navigating to the next page. Specifying the onclick to call "gotoSummaryPage" should store any inputted data.-->
          <sp-action-button emphasized selected onclick="gotoSummaryPage()">Place Order</sp-action-button>
        </div>
      </div>


    </sp-theme>
  </body>
</html>
